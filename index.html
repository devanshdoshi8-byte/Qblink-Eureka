    <script>
      // Pre-hydration theme setter — prevents flash of wrong theme on load.
      (function () {
        try {
          var stored = localStorage.getItem("qblink-theme");
          if (stored === "dark") {
            document.documentElement.classList.add("dark");
          } else if (stored === "light") {
            document.documentElement.classList.remove("dark");
          }
          // No stored preference => leave neutral so the app can show the
          // first-time appearance picker before committing to a theme.
        } catch (e) {}
      })();
    </script>
